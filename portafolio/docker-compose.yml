# Despliegue multiusuario: PostgreSQL + migraciones + API + Caddy (HTTPS) + respaldos.
# Uso: cp .env.ejemplo .env  (y complételo)  &&  docker compose up -d --build
# Ver docs/despliegue.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portafolio
      POSTGRES_USER: portafolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portafolio -d portafolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin "ports": la base no queda expuesta fuera de la red interna.

  migrar:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &entorno_api
      PORTAFOLIO_ENTORNO: produccion
      PORTAFOLIO_DB_URL: postgresql+psycopg://portafolio:${POSTGRES_PASSWORD}@db:5432/portafolio
      PORTAFOLIO_AUTH_MODO: oidc
      PORTAFOLIO_OIDC_EMISOR: ${PORTAFOLIO_OIDC_EMISOR:?Defina el emisor OIDC en .env}
      PORTAFOLIO_OIDC_AUDIENCIA: ${PORTAFOLIO_OIDC_AUDIENCIA:?Defina la audiencia OIDC en .env}
      PORTAFOLIO_OIDC_JWKS_URL: ${PORTAFOLIO_OIDC_JWKS_URL:-}
      PORTAFOLIO_POLITICA_VERSION: ${PORTAFOLIO_POLITICA_VERSION:-2026-09}
      PORTAFOLIO_CORS_ORIGENES: ${PORTAFOLIO_CORS_ORIGENES:-}
      # Caddy está en la misma red: confiar en sus encabezados X-Forwarded-*.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    environment: *entorno_api
    depends_on:
      db:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - datos_caddy:/data
    depends_on:
      - api

  respaldo:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DIAS_RETENCION: ${DIAS_RETENCION_RESPALDOS:-30}
    volumes:
      - ./respaldos:/respaldos
    entrypoint: ["/bin/sh", "-c"]
    # Un volcado diario comprimido; se borran los de más de DIAS_RETENCION días.
    # Copie /respaldos cifrado a otro lugar: un respaldo en el mismo servidor no protege de su pérdida.
    command:
      - |
        while true; do
          pg_dump -h db -U portafolio -d portafolio --format=custom --file=/respaldos/portafolio-$$(date +%Y%m%d-%H%M).dump &&
          find /respaldos -name 'portafolio-*.dump' -mtime +$$DIAS_RETENCION -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
  datos_caddy:
