[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portafolio"
version = "0.1.0"
description = "Seguimiento y cálculo de rendimientos de portafolios de inversión en Colombia"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.30"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
